# tools/_registry.yml — the catalogue of tools/, read by two renderings and one gate (#806).
#
# CLAUDE.md § Tools (the need-first index every session, subagent and worktree loads unasked)
# and the compact table in tools/README.md are GENERATED from this file by
# `npm run update-readmes`; `check-readmes` fails when either is stale. `npm run
# check:tools-registry` (inside `validate:integrity`, required) checks every row against disk in
# three directions (a file without a row, a row without a file, anything under tools/ that is not
# a plain file); `check:tools-registry -- --verify` (the non-required `tools-verify` job) runs
# each row's self-test where `verify_in_ci` allows and prints what it skipped and why.
#
# Shape, enforced by scripts/lib/tools-registry.js (dependency-free, so validate-integrity.sh can
# run it without `npm ci`): a flat list, every field on ONE line, double-quoted when it carries a
# colon. Block scalars, nesting and unknown fields are refused, not guessed. `total_tools` is the
# row count, deprecated rows included, and is checked against the list. Quoting: the reader
# interprets NO escapes — a backslash or a double quote inside a double-quoted value is refused
# (single-quote a value that carries `"`), a single quote inside a single-quoted value likewise,
# and an inline ` #` on an unquoted value is refused because YAML reads it as a comment. Fields:
#   id            kebab-case, equals the filename stem
#   path          tools/<file>
#   language      bash | python | node
#   status        active | deprecated  (deprecate, never delete: set superseded_by, keep the row)
#   superseded_by id of the replacement, or null
#   description   neutral, name-first, one clause — the README table's column
#   need          one need-first sentence, ending in a full stop — the ONLY line CLAUDE.md renders
#   not_for       optional: the tool or gate this one is most confused with
#   tag           optional: review | translation | measurement — a term covers at least two tools or is absent
#   invoke        one canonical example command
#   verify        the exact self-test invocation, naming the path or the id (a node:test suite at scripts/test/<id>.test.js)
#   verify_in_ci  true | false; false only with verify_skip_reason
#   deps          free text or null
#   promoted_from the commit or PR the tool came from (git log), never a docstring anecdote
#   issue         issue/PR numbers, or null
#
# Why need-first: the failure this catalogue exists for is a session that remembers the
# PROCEDURE and has lost the NAME (a compaction summary does exactly that). An index keyed by
# what you are trying to do recovers the name from that state; one keyed by name cannot.

total_tools: 14

