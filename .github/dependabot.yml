version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

  # The pi-durable guide's example has its own package (#1009). pi-durable pins
  # pi-ai and chord at its own exact version, so the three move together: a bump
  # of one alone installs pi-ai twice.
  - package-ecosystem: npm
    directory: /scripts/test/_pi-durable-example
    schedule:
      interval: weekly
    groups:
      pi:
        patterns: ["@earendil-works/*"]

  - package-ecosystem: npm
    directory: /viz
    schedule:
      interval: weekly
