name: Validate Skill Content Security

on:
  # No `paths:` filter, deliberately. The scan covered `skills/` only, so the filter matched its
  # scope. #407 added a privacy rule over seven trees, and the near-miss that motivated that rule
  # landed in `tests/` — a path the old filter did not name, so the scan would not have run on the
  # PR carrying it, before or after merge. A control that fires only when a PR happens to touch
  # `skills/` certifies the tree it did not read.
  #
  # Dropping the filter rather than extending it also keeps this workflow eligible to become a
  # required check: a path-filtered workflow does not report outside its filter, and a required
  # check that never reports sits on "Expected" and refuses the merge forever (#641).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Scan skill content for secrets and dangerous executables
        run: node scripts/scan-skill-content.js
