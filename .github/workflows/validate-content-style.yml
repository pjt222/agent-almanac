name: Validate Content Style

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'agents/**'
      - 'teams/**'
      - 'guides/**'
      - 'i18n/**'
      - 'scripts/check-yaml-fences.js'
      - 'scripts/check-banned-invocations.js'
      - '.github/workflows/validate-content-style.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'agents/**'
      - 'teams/**'
      - 'guides/**'
      - 'i18n/**'
      - 'scripts/check-yaml-fences.js'
      - 'scripts/check-banned-invocations.js'
      - '.github/workflows/validate-content-style.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # PR: block decorative table separators AND untagged code fences on ADDED
      # lines. Only added lines are checked, so editing a legacy file does not
      # force normalizing its pre-existing violations. See guides/content-styleguide.md.
      - name: Check added lines (pull request)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          node scripts/check-content-style.js --added FETCH_HEAD

      # push / manual: repo-wide informational scan, never blocks (corpus normalized in #272).
      - name: Repo-wide scan (informational)
        if: github.event_name != 'pull_request'
        run: node scripts/check-content-style.js --all

  # Blocking, and repo-wide rather than added-lines-only: the corpus is at zero
  # (#507), so there is no legacy backlog to grandfather, and a fence tagged
  # `yaml` that is not YAML freezes content into ten locales that should have
  # stayed translatable. Its own job because it needs `npm ci` for js-yaml,
  # which the style job does not.
  yaml-fences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run validate:yaml-fences

  # Blocks any command the repo forbids, in prose as well as in fences. The fence-parity
  # gate cannot do this job: it accepts a match against ANY historical English revision,
  # so a deliberate deletion in English never propagates and the old form stays green
  # forever. See #526.
  banned-invocations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run validate:banned-invocations
