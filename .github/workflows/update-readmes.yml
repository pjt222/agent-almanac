name: Update READMEs
on:
  push:
    branches: [main]
    paths:
      - 'skills/_registry.yml'
      - 'agents/_registry.yml'
      - 'teams/_registry.yml'
      - 'guides/_registry.yml'
      - 'tests/_registry.yml'
      - 'i18n/_config.yml'
      - 'i18n/**/*.md'
      # Staleness inputs: per-locale stale counts in translation_status.yml
      # derive from git history of the English trees (git-freshness.js
      # pathspecs) — a body-only English edit changes staleness but used to
      # never trigger regeneration (#362). The negations exclude this job's
      # own auto-committed outputs so the deploy-key push (which, unlike
      # GITHUB_TOKEN, does re-trigger workflows) cannot re-trigger it.
      - 'skills/**'
      - 'agents/**'
      - 'teams/**'
      - 'guides/**'
      - '!skills/README.md'
      - '!agents/README.md'
      - '!teams/README.md'
      - '!guides/README.md'
      - '!guides/quick-reference.md'
      # i18n/README.md became a generated output in #569, and it matches the `i18n/**/*.md`
      # trigger above — so without this negation the auto-commit re-triggers this workflow.
      - '!i18n/README.md'
      # Generator changes must regenerate committed output at the causing
      # commit, not fail check-readmes at the next release (#362).
      # The tools catalogue feeds CLAUDE.md § Tools and tools/README.md's table (its reader is
      # a generator import, which check-workflow-generator-inputs.js requires here too).
      - 'tools/_registry.yml'
      - 'scripts/lib/tools-registry.js'
      - '!tools/README.md'
      - 'scripts/generate-readmes.js'
      - 'scripts/generate-translation-status.js'
      - 'scripts/lib/git-freshness.js'
      # The stub verdict itself. Extracted to a lib in #553, but never added
      # here -- so a change to what counts as an untranslated scaffold did not
      # regenerate the counts it decides. Load-bearing since #560, because the
      # README table now derives from those counts too.
      - 'scripts/lib/translation-status.js'
      # Same reason, and the same mistake waiting to be repeated (#566): the pure half of
      # generate-readmes.js now lives here, so a change to how a section RENDERS must
      # regenerate the sections it decides. Nothing would catch the omission — A8 validates
      # file_pattern and the negations, never generator-input triggers.
      - 'scripts/lib/readme-sections.js'
      - 'scripts/lib/content-types.js'
      # `scripts/*` above is a SINGLE star matching the generator's non-recursive readdirSync
      # scope, so it does not reach `scripts/lib/`. Every module under it is therefore listed
      # by hand — which is why `check:generator-inputs` exists, and why it caught this one on
      # the PR that added it (#691).
      - 'scripts/lib/skills-inventory.js'
      # The middle of the chain, and it was skipped while BOTH endpoints were listed:
      #   generate-translation-status.js -> lib/translation-status.js -> lib/fences.js
      # fences.js is not a passive re-exporter — extractFences, isGated, contentKey,
      # fenceShape and hasSwallowedOpener decide stub classification, which sets the
      # translated/stubs figures the README renders verbatim. A push touching only this file
      # changed generated output while matching no trigger path.
      - 'scripts/lib/fences.js'
      # Fourth time this list has been extended for the same reason, so state the rule rather
      # than the instance: EVERY module generate-translation-status.js imports is an input,
      # because the counts it writes are what the README table renders. provenance.js owns the
      # frontmatter reader that resolves `source_commit`, and staleness is computed from that
      # value -- a change to how it is parsed moves the stale counts with no content file
      # touched. Added at the commit that introduced the import (#552), which is the whole
      # lesson of the three comments above.
      - 'scripts/lib/provenance.js'
      # Fifth, sixth and seventh entries of the same class, and the last three added by hand:
      # `npm run check:generator-inputs` now derives this list from the job's own `run:` steps
      # and refuses when a reachable module is unlisted, so the next omission is a red check
      # rather than a note in a comment. It found all three below, two of which #618 named and
      # one of which nobody had:
      #
      #   english-history.js   the shared English-history walk whose collectors set the
      #                        stub/translated/unjudged verdicts the README table renders
      #   content-paths.js     resolves the paths that walk and the status generator enumerate
      #   guide-categories.js  decides which guide categories are rendered at all -- extracted
      #                        three days earlier in #646, unlisted from the moment it existed
      - 'scripts/lib/english-history.js'
      - 'scripts/lib/content-paths.js'
      - 'scripts/lib/guide-categories.js'
      # Not a generator: this job also RUNS the parity validator, and a change to it changes
      # whether the job succeeds. Listed because the derived check's rule is "everything this
      # job runs", which a reader can apply without a second list of which steps write files.
      - 'scripts/check-readme-translation-parity.js'
      # Added because `npm run check:generator-inputs` refused the commit that introduced the
      # import (#619) -- which is the gate from #618 doing exactly its job, one PR later, on a
      # module its author had not thought about. The list is no longer maintained by memory.
      - 'scripts/lib/parse-args.js'
      # Second time the derived check has refused a commit that added an import (#587, after
      # #619). Both were modules their author had not considered; neither would have been
      # noticed by the four hand-maintained rounds that preceded #618.
      - 'scripts/lib/git-batch.js'
      # THIRD refusal by the derived check, and the first that reaches outside `scripts/` (#600).
      # SECURITY.md's CLI bullet is generated from `listAdapters()` rather than hand-listed —
      # the hand-written version named 5 of the 13 adapters and described all of them as
      # symlinking into home directories, when four install strategies exist and several install
      # at project scope. Deriving it puts the whole adapter tree on this job's import graph, so
      # a new adapter, a renamed one, or a changed `strategy` now moves generated output.
      #
      # Which is the argument for deriving it, arriving as a red check: the reviewer who proposed
      # `listAdapters()` predicted this gate would start guarding the adapters "without anyone
      # remembering to", and it refused the commit that made it true.
      - 'cli/adapters/*'
      - 'cli/lib/*'
      # NOT import-graph inputs, and that is exactly why they need listing by hand (#691).
      # `generateSecuritySurface` COUNTS these two directories with `readdirSync`, so adding a
      # script or a workflow moves generated output — and `check:generator-inputs` cannot see it,
      # because it derives the input set from imports and a directory listing is not an import.
      #
      # Single star, matching the non-recursive `readdirSync` scope, and it fires on deletions
      # too. Without these, the drift lands at some later unrelated commit and surfaces as the
      # daily schedule going red with nothing to auto-repair it — the failure this workflow's own
      # header says it exists to prevent.
      - 'scripts/*'
      - 'workflows/*'
      # The toolchain is an input too. generate-readmes.js parses YAML with js-yaml, so a
      # Dependabot bump that changes `yaml.load` behaviour changes generated output while
      # touching no content file and no generator -- nothing here matched, so the healer never
      # ran, and the drift sat until an unrelated push healed it or a release went red. Same
      # rationale as #362 listing the generators: heal at the causing commit.
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Push via a write deploy key so the auto-commit bypasses the default
          # branch ruleset's required status checks. github-actions[bot] /
          # GITHUB_TOKEN cannot be a ruleset bypass actor (by GitHub design), so
          # the deploy key (registered as a DeployKey bypass actor on the ruleset)
          # is what lets this job keep pushing to main after `line-endings` became
          # a required check. See guides/protecting-github-repositories.md.
          ssh-key: ${{ secrets.README_DEPLOY_KEY }}
          # Full history: generate-translation-status.js derives staleness from
          # per-file `git log` + `merge-base --is-ancestor`; a shallow clone
          # makes every translation read as fresh (stale: 0) — see #279.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # Order is load-bearing (#560): the README translations table now reads
      # i18n/*/translation_status.yml, so the status files must be regenerated
      # FIRST. Run the other way round and the table renders last cycle's
      # numbers while the same commit overwrites the file it read -- the two
      # surfaces disagree again, one cycle behind, and both land in one commit.
      - run: npm run translation:status
      - run: node scripts/generate-readmes.js
      # Fails the job if the two committed surfaces disagree, rather than
      # auto-committing a contradiction. Parses both artifacts independently;
      # it never calls the generator.
      - run: npm run validate:readme-parity
      # SHA-pinned: https://github.com/stefanzweifel/git-auto-commit-action/releases/tag/v7
      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d
        with:
          commit_message: "docs: auto-update README statistics and translation status"
          file_pattern: "README.md skills/README.md agents/README.md teams/README.md CLAUDE.md guides/README.md guides/quick-reference.md viz/README.md tests/README.md i18n/README.md SECURITY.md tools/README.md i18n/de/translation_status.yml i18n/zh-CN/translation_status.yml i18n/ja/translation_status.yml i18n/es/translation_status.yml i18n/caveman-lite/translation_status.yml i18n/caveman/translation_status.yml i18n/caveman-ultra/translation_status.yml i18n/wenyan-lite/translation_status.yml i18n/wenyan/translation_status.yml i18n/wenyan-ultra/translation_status.yml"
