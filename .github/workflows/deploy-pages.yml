name: Deploy viz to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'viz/**'
      # build-data.js opens every skills/<id>/SKILL.md and derives the node title,
      # metadata.tags, and the entire skill-to-skill link set, so editing a
      # `## Related Skills` section changes the published graph (#451). Scoped to
      # */SKILL.md rather than 'skills/**' because references/ and examples/ are
      # never opened; _template is excluded for the same reason, since the read
      # loop iterates the registry and _template has no entry there.
      - 'skills/_registry.yml'
      - 'skills/*/SKILL.md'
      - '!skills/_template/SKILL.md'
      - 'agents/_registry.yml'
      - 'teams/_registry.yml'
      # guides/_registry.yml is deliberately absent -- no deploy step reads it
      # (#452). agents/*.md and teams/*.md likewise: build-data.js reads only
      # their registries, never their bodies.
      - 'i18n/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: viz/package-lock.json

      - name: Install dependencies
        working-directory: viz
        run: npm ci

      # This workflow triggers on the _registry.yml paths, but nothing in the
      # build read them, so registry-only pushes redeployed the previously
      # committed skills.json unchanged (#363). build-data.js regenerates it
      # from the skills/agents/teams registries; vite then copies publicDir
      # into dist. Only the data step belongs here -- the icon manifests are
      # inputs to the R renderers in build.sh and are never fetched at runtime.
      # data/workflow.mmd IS runtime-fetched but is R-generated and committed
      # by hand; see the Viz Deploy Model section in CLAUDE.md.
      - name: Generate viz data from registries
        working-directory: viz
        run: npm run build-data

      - name: Build
        working-directory: viz
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: viz/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
