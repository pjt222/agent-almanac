name: CI Node CLI
on:
  # No `paths:` filter, deliberately (#641): a REQUIRED status check that does not run sits on
  # "Expected — waiting for status to be reported" and refuses the merge forever, so only an
  # unfiltered workflow can be required.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # Before this gate, test:cli ran in CI only as the prepublishOnly hook at
      # release time — a CLI regression merged on main surfaced weeks later at
      # the next npm publish, misattributed (#326 item 8).
      - run: npm run test:cli
